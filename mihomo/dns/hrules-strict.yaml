# Hrules DNS v0.1 candidate — Strict
# Experimental validation artifact, not a production include.
#
# Strict inherits Stable's bootstrap/node-DNS path. Global DoH remains unbound
# in this static candidate; production binding must target a real generated
# Hrules group. nameserver-policy stays disabled until cold-start/provider tests
# prove that policy loading cannot break node establishment.
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fake-ip-filter:
    - "*.lan"
    - "*.local"

# nameserver-policy: intentionally gated.
