# Hrules DNS v0.1 candidate — Strict
# Experimental: policy entries are deliberately NOT enabled yet.
# Strict must first inherit the validated Stable bootstrap/node-DNS path.
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fake-ip-filter:
    - "*.lan"
    - "*.local"

# nameserver-policy is gated on cold-start/rule-provider validation.
