# Hrules DNS v0.1 candidate — Stable
# Experimental validation artifact, not a production include.
#
# IMPORTANT:
# The two global DoH endpoints below are intentionally unbound in this static
# candidate. The production adapter must append #<REAL_HRULES_GROUP> only after
# the generated proxy-group inventory exists. This file therefore validates
# resolver syntax/bootstrap behavior, not final DoH egress ownership.
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fake-ip-filter:
    - "*.lan"
    - "*.local"
