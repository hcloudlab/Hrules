proxy-groups:
- name: 🤖 AI 服务 [场景]
  type: select
  include-all-proxies: true
  proxies:
  - PROXY
  - DIRECT
  include-all-proxies: true
- name: 📺 YouTube [场景]
  type: select
  include-all-proxies: true
  proxies:
  - PROXY
  - DIRECT
  include-all-proxies: true
- name: 💬 Telegram [场景]
  type: select
  include-all-proxies: true
  proxies:
  - PROXY
  - DIRECT
  include-all-proxies: true
- name: 🚀 漏网之鱼 [自选]
  type: select
  include-all-proxies: true
  proxies:
  - PROXY
  - DIRECT
  include-all-proxies: true
rule-providers:
  hrules-private-direct:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/hcloudlab/Hrules/main/mihomo/scenes/private_direct.yaml
    path: ./providers/private_direct.yaml
    interval: 21600
  hrules-general-ai:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/hcloudlab/Hrules/main/mihomo/scenes/general_ai.yaml
    path: ./providers/general_ai.yaml
    interval: 21600
  hrules-youtube-media:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/hcloudlab/Hrules/main/mihomo/scenes/youtube_media.yaml
    path: ./providers/youtube_media.yaml
    interval: 21600
  hrules-cn-direct:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/hcloudlab/Hrules/main/mihomo/scenes/cn_direct.yaml
    path: ./providers/cn_direct.yaml
    interval: 21600
rules:
- RULE-SET,hrules-private-direct,DIRECT
- RULE-SET,hrules-general-ai,🤖 AI 服务 [场景]
- RULE-SET,hrules-youtube-media,📺 YouTube [场景]
- RULE-SET,hrules-cn-direct,DIRECT
- MATCH,🚀 漏网之鱼 [自选]
