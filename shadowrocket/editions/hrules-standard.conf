🤖 AI 服务 [场景] = select,♻️ 自动选择 [系统],🌐 全部节点 [系统],PROXY
🔐 重要账户 [场景] = select,🌐 全部节点 [系统],PROXY
📺 YouTube [场景] = select,♻️ 自动选择 [系统],🌐 全部节点 [系统],PROXY
💬 Telegram [场景] = select,♻️ 自动选择 [系统],🌐 全部节点 [系统],PROXY
