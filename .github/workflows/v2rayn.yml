name: v2rayN

# v2rayn/hrules.json is generated by Hrules-core (generators/build_v2rayn.py).
# scripts/build_v2rayn.py is a vendored copy used only to verify that the
# published rule set matches the published Mihomo routing layer and scenes.
on:
  push:
    paths:
      - "v2rayn/**"
      - "mihomo/scenes/**"
      - "mihomo/routing.yaml"
      - "scripts/build_v2rayn.py"
      - ".github/workflows/v2rayn.yml"
  pull_request:
    paths:
      - "v2rayn/**"
      - "mihomo/scenes/**"
      - "mihomo/routing.yaml"
      - "scripts/build_v2rayn.py"
      - ".github/workflows/v2rayn.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - run: python scripts/build_v2rayn.py --public-root . --check
