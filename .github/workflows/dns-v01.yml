name: DNS v0.1 validation

on:
  push:
    branches:
      - feature/mihomo-dns-v0.1
  pull_request:
    paths:
      - "mihomo/dns/**"
      - "mihomo/editions/hrules-stable.js"
      - "docs/dns-*.md"
      - "scripts/validate_dns_v01.py"
      - ".github/workflows/dns-v01.yml"

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate DNS v0.1 contracts
        run: python3 scripts/validate_dns_v01.py
